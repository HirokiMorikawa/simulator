name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  native:
    name: fmt / clippy / test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 性能ベンチ回帰ゲートが merge-base を `git worktree` で取り出すため、
          # 既定の shallow clone (fetch-depth: 1) では足りない。
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (全ドメインの解析解テスト・決定論テスト)
        run: cargo test --workspace
      - name: 性能ベンチ回帰ゲート(横断DoD④)
        # 同一ジョブ・同一ランナー上で merge-base をワークツリーへ取り出して
        # ベースラインを採り、作業ツリー側と criterion の `--baseline` で比較する。
        # criterion 自体は回帰を表示するだけで exit 0 のままなので、
        # `change/estimates.json` を読んで閾値超過で落とすのがスクリプトの役目。
        # 設計判断と閾値の実測的な根拠は scripts/check_bench_regression.py の
        # モジュールdocを参照。
        run: python3 scripts/check_bench_regression.py --threshold 0.25

  wasm:
    name: wasm-pack build (sim-wasm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: wasm-pack build
        run: wasm-pack build crates/sim-wasm --target web --out-dir ../../demo/pkg
      - uses: actions/upload-artifact@v4
        with:
          name: sim-wasm-pkg
          path: demo/pkg

  demo:
    name: demo build + Playwright smoke (Vite)
    runs-on: ubuntu-latest
    needs: wasm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: sim-wasm-pkg
          path: demo/pkg
      - name: npm ci
        working-directory: demo
        run: npm ci
      - name: npm run build
        working-directory: demo
        run: npm run build
      - name: install Playwright chromium
        working-directory: demo
        run: npx playwright install --with-deps chromium
      - name: Playwright スモークテスト(フロントエンドの配線検証)
        # これまでフロントエンドのテストがCIに1本も無かった(`npm run build` =
        # `tsc --noEmit` + `vite build` のみ)。各増分で手動実行していた確認を
        # `demo/tests/smoke.spec.ts` として資産化したもの。物理の正しさはRust側の
        # 解析解テストが担保しており、ここが守るのは「起動し、wasmが初期化され、
        # 主要な操作でクラッシュしない」という配線の健全性だけである。
        working-directory: demo
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: demo/playwright-report
